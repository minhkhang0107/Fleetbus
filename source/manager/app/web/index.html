<!DOCTYPE html>
<html lang="vi">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BusGo Operations Control Center - High-density 60Hz real-time fleet dispatch, telemetry radar, and revenue intelligence portal.">

  <!-- Open Graph -->
  <meta property="og:title" content="BusGo Operations Control Center">
  <meta property="og:description" content="Trung tâm Điều hành Hạm đội & Giám sát Radar Xe Khách Trực Tuyến BusGo.">
  <meta property="og:type" content="website">

  <!-- Title & Icon -->
  <title>BusGo Operations Control Center</title>
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Google Fonts: Geist & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0B0F17;
      color: #F8FAFC;
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #1E293B 0%, #0B0F17 100%);
      z-index: 9999;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(6, 182, 212, 0.2);
      border-top-color: #06B6D4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-title {
      margin-top: 20px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #E2E8F0;
    }
    .loading-subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: #64748B;
      font-family: 'JetBrains Mono', monospace;
    }
  </style>

  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="loading-container">
    <div class="spinner"></div>
    <div class="loading-title">BUSGO OPERATIONS CONTROL CENTER</div>
    <div class="loading-subtitle">Initializing 60Hz Telemetry & Radar Engine...</div>
  </div>

  <script>
    window.addEventListener('load', function() {
      _flutter.loader.loadEntrypoint({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: "canvaskit"
          }).then(function(appRunner) {
            const loader = document.getElementById('loading-container');
            if (loader) loader.style.display = 'none';
            appRunner.runApp();
          });
        }
      });
    });
  </script>
</body>
</html>
